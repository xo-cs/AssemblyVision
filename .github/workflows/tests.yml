# CPU tests on synthetic and public fixtures only (Week 11, TA review). The runner never has
# data/ (QiSens or public datasets) or models/: both are outside git, and the job stops if
# either appears. No GPU, no model weights, no network service of the project is used.
name: tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CUDA_VISIBLE_DEVICES: ""
      YOLO_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements-ci.lock
      - name: System packages (ffmpeg for the media fixtures, libGL for OpenCV)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1
      - name: Install the locked packages
        run: pip install -r code/requirements-ci.lock
      - name: No project data or weights on the runner
        run: |
          test ! -e data && test ! -e models
          python scripts/make_ci_lock.py && git diff --exit-code code/requirements-ci.lock
      - name: CPU tests
        working-directory: code
        run: python -m unittest discover -s tests
