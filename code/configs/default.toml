# AssemblyVision default configuration (LLD 3.0.5).
# Every parameter lives here with its default. Later layers (gpu.toml, steps.toml,
# run_config.toml, command line) may only override keys that exist in this file.

[run]
seed = 42
progress_every_s = 2.0       # longest time between progress lines (s)

[paths]
# Relative to ~/AssemblyVision. QiSens runs write only under qisens_root,
# public runs only under public_root (CLAUDE.md data layout).
qisens_root = "data/qisens"
public_root = "data/public"
models_dir = "models"

[ingest]
max_fps = 30                 # cap of the constant frame rate (frames/s)
default_fps = 25             # used if the source fps cannot be read (frames/s)
crf = 18                     # x264 quality of cfr.mp4, lower is better
min_duration_s = 60.0        # shortest video that can be split (s)
disk_factor = 3.0            # free disk needed before transcoding (x file size)
vfr_tolerance_ms = 1.0       # largest frame interval deviation still treated as constant (ms)

[split]
train_frac = 0.60
val_frac = 0.10

[shots]
cut_threshold = 25.0         # PySceneDetect ContentDetector threshold (tuned on shots_tune_480p30: 15 to 35 all perfect)
min_shot_s = 1.0             # shorter shots merge into the previous one (s)
fixed_motion_max = 0.002     # fixed if the 90th percentile background motion is below this (fraction of width)
motion_pairs = 20            # frame pairs for the background motion
motion_pair_s = 0.5          # time between the two frames of a pair (s)

[pose]
variant = "m"                # YOLO26 pose variant: n, s, m or l
fallback_variant = "s"       # used once when the GPU runs out of memory ("" = none)
imgsz = 640                  # inference size (px)
det_conf_min = 0.10          # detector threshold, low so the tracker can use weak detections
ref_conf_min = 0.50          # threshold for the reference frame
ref_search_s = 5.0           # seconds scanned for a reference frame
half = false                 # FP32 only, the Pascal GPU gives no gain from FP16
hand_crop_margin = 0.15      # margin added to the box for RTMW

[track]
algorithm = "bytetrack"
high_thresh = 0.25           # first association; ByteTrack high score band
low_thresh = 0.10            # second association only (low to high band); never starts a track
new_thresh = 0.25            # a new track starts only at or above this score
match_thresh = 0.80          # IoU based matching threshold
buffer_s = 1.0               # longest gap in which identity is kept (s)
min_track_s = 1.0            # shorter tracks are not stored (s)
auto_subject_min_coverage = 0.30   # automatic subject only if the longest track covers this share of the shot
dup_suppress = true          # drop duplicate partial skeletons of one worker before tracking
dup_iou = 0.70               # duplicate if IoU with a higher scoring box is at least this
dup_contain = 0.80           # or if the smaller box lies this much inside the other ...
dup_kp_agree = 0.60          # ... and this share of the shared keypoints coincide
dup_kp_conf = 0.30           # keypoints at or above this confidence count as shared
dup_kp_dist = 0.10           # coincide = closer than this fraction of the smaller box diagonal

[gpu]
pose = 0                     # GTX 1080 Ti (PCI bus order)

[overlay]
kp_conf_min = 0.30           # keypoints below this are drawn faded (display only)
max_width = 1920             # overlay is scaled down to this width (px)
crf = 20                     # x264 quality of the overlay video
