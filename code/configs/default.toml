# AssemblyVision default configuration (LLD 3.0.5).
# Every parameter lives here with its default. Later layers (gpu.toml, steps.toml,
# run_config.toml, command line) may only override keys that exist in this file.

[run]
seed = 42
progress_every_s = 2.0       # longest time between progress lines (s)

[profile]
# Stage profiler (Week 10): per stage times, the pose breakdown and GPU samples in manifest["profile"].
enabled = false              # tools/exp turns it on for experiments
gpu_sample_s = 0.5           # nvidia-smi query interval (s)

[paths]
# Relative to ~/AssemblyVision. QiSens runs write only under qisens_root,
# public runs only under public_root (CLAUDE.md data layout).
qisens_root = "data/qisens"
public_root = "data/public"
models_dir = "models"

[ingest]
max_fps = 30                 # cap of the constant frame rate (frames/s)
default_fps = 25             # used if the source fps cannot be read (frames/s)
crf = 18                     # x264 quality of cfr.mp4, lower is better
min_duration_s = 60.0        # shortest video that can be split (s)
disk_factor = 3.0            # free disk needed before transcoding (x file size)
vfr_tolerance_ms = 1.0       # largest frame interval deviation still treated as constant (ms)

[split]
train_frac = 0.60
val_frac = 0.10

[shots]
cut_threshold = 25.0         # PySceneDetect ContentDetector threshold (tuned on shots_tune_480p30: 15 to 35 all perfect)
min_shot_s = 1.0             # shorter shots merge into the previous one (s)
fixed_motion_max = 0.002     # fixed if the 90th percentile background motion is below this (fraction of width)
motion_pairs = 20            # frame pairs for the background motion
motion_pair_s = 0.5          # time between the two frames of a pair (s)
downscale = 0                # cut detection frame downscale factor; 0 = PySceneDetect automatic (default)

[pose]
variant = "x"                # YOLO26 pose variant: n, s, m, l or x (x FP32: 67 fps on the A5000, Week 9 benchmark)
fallback_variant = "s"       # used once when the GPU runs out of memory ("" = none)
imgsz = 640                  # inference size (px)
det_conf_min = 0.10          # detector threshold, low so the tracker can use weak detections
ref_conf_min = 0.50          # threshold for the reference frame
ref_search_s = 5.0           # seconds scanned for a reference frame
half = false                 # FP32; FP16 gave no speedup on the A5000 (Week 9 benchmark) and its accuracy cost is unmeasured.
                             # true asks for FP16, used only on tensor core GPUs (compute capability >= 7.0)
hand_crop_margin = 0.15      # margin added to the box for RTMW
batch = 1                    # frames per inference call; 1 = one frame at a time (reference)
decode = "opencv"            # frame reader of the pose pass: opencv, prefetch (reader thread) or ffmpeg_cuda (NVDEC)
prefetch_frames = 64         # frames queued ahead by the prefetch and ffmpeg_cuda readers
reference_in_pass = false    # true: reference frames are taken from the pose pass (no second decode of the video)

[track]
algorithm = "bytetrack"
high_thresh = 0.25           # first association; ByteTrack high score band
low_thresh = 0.10            # second association only (low to high band); never starts a track
new_thresh = 0.25            # a new track starts only at or above this score
match_thresh = 0.80          # IoU based matching threshold
buffer_s = 1.0               # longest gap in which identity is kept (s)
min_track_s = 1.0            # shorter tracks are not stored (s)
auto_subject_min_coverage = 0.30   # automatic subject only if the longest track covers this share of the shot
dup_suppress = true          # drop duplicate partial skeletons of one worker before tracking
dup_iou = 0.70               # duplicate if IoU with a higher scoring box is at least this
dup_contain = 0.80           # or if the smaller box lies this much inside the other ...
dup_kp_agree = 0.60          # ... and this share of the shared keypoints coincide
dup_kp_conf = 0.30           # keypoints at or above this confidence count as shared
dup_kp_dist = 0.10           # coincide = closer than this fraction of the smaller box diagonal
overlap_pose = false         # true: each shot is tracked in a worker process while pose goes on (needs pose.reference_in_pass)

[clean]
body_conf_min = 0.30         # keypoints below this become NaN (LLD 3.6)
gap_max_s = 0.5              # longest gap that is interpolated (never counted as measured) (s)
sg_window_s = 0.33           # Savitzky Golay window, made odd in frames (s)
sg_order = 2                 # Savitzky Golay polynomial order

[seg_a]
phase_solver = "dp"          # "dp" = best global boundary choice, "forward" = LLD forward walk
min_factor = 0.25            # phase min_s = min_factor * T / K (T = first to last frame with a person)
max_factor = 2.5             # phase max_s = max_factor * T / K
pause_energy = 0.15          # motion energy below this is still (torso lengths/s)
pause_min_s = 0.8            # shortest pause (s)
long_pause_s = 5.0           # pause that counts as phase boundary evidence (s)
cut_pause_window_s = 2.0     # a long pause this close to a cut makes the cut stronger (s)
no_person_min_s = 1.5        # stretch without any stored track that counts as evidence (s)
fallback_pause_min_s = 1.5   # pause that cuts a segment when no vocabulary exists (s)
other_min_s = 1.0            # shorter stretches between steps join the previous step (s)
strength_no_person = 1.0     # evidence strengths used by both solvers
strength_cut_pause = 0.6
strength_pause = 0.4
strength_cut = 0.2
activity_change = false      # add the subject activity change to cut, cut_pause and pause candidates
ac_weight = 0.4              # strength += ac_weight * change (0 to 1); fixed before any QiSens result, see rules.py
ac_window_s = 10.0           # window before and after a candidate compared for the change (s)

[steps]
# The vocabulary lives in configs/steps.toml (LLD 3.0.5); this is the empty default.
use = true                   # false = pause based segment_1..n fallback (AV-SEG-003)
mode = "ordered"             # phases in this order, each at most once, never backwards
step = []                    # [{name, min_s?, max_s?}, ...]; limits default to the derived ones

[eval]
seg_fps = 15                 # frame sampling for frame accuracy, edit and F1 (frames/s)
kappa_fps = 5                # frame sampling for Cohen's kappa (frames/s)
overlaps = [0.10, 0.25, 0.50]   # IoU thresholds of the segmental F1
label = ""                   # written into eval.json when set, e.g. "after error analysis, not blind"

[motion]
# MotionAnalyzer (LLD 3.7). Add "gaze" to enabled for the rough gaze direction (FR-MOTION-08, Want).
enabled = ["duration", "path", "back_bending", "repetition", "hand_travel", "two_hand", "idle"]
angle_bands = [20.0, 45.0, 60.0]   # trunk angle band edges B0 | B1 | B2 | B3 (deg)
cov_min = 0.50               # below this share of measured frames a metric is NULL (AV-MOT-001)
path_hz = 5                  # sampling of the stored mid hip path (samples/s)
jitter_torso = 0.005         # wrist steps below this count as zero (torso lengths/frame)
rep_lag_min_s = 0.4          # repetition periods searched (s)
rep_lag_max_s = 2.0
rep_window_s = 10.0          # autocorrelation window (s)
rep_hop_s = 5.0              # window step (s)
rep_acf_min = 0.5            # a window is periodic if its autocorrelation peak reaches this
idle_energy = 0.15           # idle below this motion energy (torso lengths/s)
idle_min_s = 1.0             # shortest idle stretch (s)
foreshort_ratio = 0.6        # torso shorter than this share of the shot's 90th percentile is foreshortened
view_limited_share = 0.30    # flag view_limited above this share of foreshortened frames
hand_active = 0.3            # a hand is active at or above this wrist speed relative to the hip (torso lengths/s)
gaze_conf_min = 0.5          # face keypoints below this are not used for gaze
gaze_yaw = 0.3               # |nose offset from the eye midpoint| / eye distance above this is left or right
gaze_down_torso = 0.10       # nose this far below the ears (torso lengths) is looking down
stream_rep_every_s = 1.0     # live: repetition is recomputed this often (s)
stream_torso_s = 10.0        # live: running median of the torso length over this time (s)

[heatmap]
cell_m = 0.10                # grid cell with a floor scale (m)
cell_px = 20                 # grid cell without a floor scale (px)
min_samples = 30             # fewer path samples give no heatmap

[gpu]
pose = 0                    # RTX A5000 24 GB, Ampere (PCI bus order, bus 01:00)

[overlay]
kp_conf_min = 0.30           # keypoints below this are drawn faded (display only)
max_width = 1920             # overlay is scaled down to this width (px)
crf = 20                     # x264 quality of the overlay video
enabled = true               # false skips the overlay video (like --no-overlay)
encoder = "libx264"          # libx264 or h264_nvenc (GPU encoder of the pose GPU)
workers = 1                  # >1: the frame range is rendered in this many parallel chunks, joined without re-encoding

[ui]
# host 127.0.0.1, port 7860 and share=False are fixed in ui/app.py (FR-INFRA-06, NFR-SEC-03)
poll_s = 2.0                 # status poll interval of the Run tab (s)
max_upload_mb = 4096         # largest upload accepted (MB)

[live]
gpu = 1                      # RTX A4000 16 GB, Ampere (PCI bus order, bus 03:00); batch pose stays on gpu.pose
half = true                  # FP16 on the A4000
pose_model = "yolo26s-pose.pt"
input_px = 640               # longest side of the frame given to the model (px)
det_conf = 0.25              # person detection threshold
kp_conf_min = 0.30           # keypoint threshold for events, angles and smoothing
stream_every_s = 0.04        # the browser offers a frame this often (s), 25 fps at most
rate_steps = [25, 20, 15, 10]   # frames per second the session accepts; it steps down this list ...
rate_p95_ms = 150.0          # ... when the server delay p95 (last 3 s) is above this (ms)
rate_drop_max = 0.25         # ... or this share of the frames was dropped (replaced unprocessed)
rate_hold_s = 3.0            # at least this long between two rate changes (s)
rate_up_s = 10.0             # good this long (p95 under half the limit, few drops): one step up again (s)
zone_hold_s = 0.2            # a wrist must stay in or out this long to change zone state (s)
one_euro_min_cutoff = 1.0    # One Euro filter on every keypoint coordinate (Hz)
one_euro_beta = 0.007
one_euro_d_cutoff = 1.0      # (Hz)
lost_s = 3.0                 # subject or camera unseen this long: open steps close as lost (s)
idle_stop_s = 120.0          # no frame this long ends the session (s; LLD 10, longer to survive a reload)
max_session_s = 1800.0       # longest session (s)
rec_fps = 10                 # frame rate of the recording
min_free_mb = 1500           # free GPU memory needed to start (MB)
warn_fps = 5.0               # panel warning below this processed frame rate
default_template = "workbench"
model_keep_s = 600.0         # the model is released after this long without a session (s)
lift_knee_conf = 0.5         # combined live view: a leg (hip, knee, ankle) counts as seen at this confidence
lift_knee_seen = 0.6         # ... and a lift counts only when the knee was seen in this share of its frames
